name: Build test installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-installers
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run automated tests
        run: npm test

      - name: Test media recovery and recent history
        run: node scripts/testar-sincronizacao-recente.js

      - name: Test Windows packaging
        run: npm run test:windows-packaging

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsIAPP-Windows-x64-${{ github.run_number }}
          path: |
            dist/windows/*.exe
            dist/windows/*.yml
            dist/windows/*.blockmap
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Test media recovery and recent history
        run: node scripts/testar-sincronizacao-recente.js

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Prepare packaged Chrome
        run: npm run prepare:chrome

      - name: Prepare macOS icon
        run: npm run prepare:icon

      - name: Build macOS arm64 test files
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS package
        run: node scripts/verificar-release.js

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsIAPP-macOS-arm64-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
