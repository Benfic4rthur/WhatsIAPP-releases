name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Prepare packaged Chrome
        run: npm run prepare:chrome
      - name: Prepare macOS icon
        run: npm run prepare:icon
      - name: Build macOS release files
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify release package
        run: node scripts/verificar-release.js
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep only the current GitHub release after successful publication
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const currentTag = context.ref.replace('refs/tags/', '');
            const { data: current } = await github.rest.repos.getReleaseByTag({ ...repo, tag: currentTag });
            if (current.draft || !current.assets.some(a => a.name.endsWith('.dmg')) || !current.assets.some(a => a.name === 'latest-mac.yml')) {
              throw new Error('Release atual incompleta; anteriores preservadas.');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            for (const release of releases.filter(r => r.tag_name !== currentTag)) {
              await github.rest.repos.deleteRelease({ ...repo, release_id: release.id });
              core.info('Release ' + release.tag_name + ' removida.');
            }
            const tags = await github.paginate(github.rest.repos.listTags, { ...repo, per_page: 100 });
            for (const tag of tags.filter(t => /^v\d+\.\d+\.\d+$/.test(t.name) && t.name !== currentTag)) {
              await github.rest.git.deleteRef({ ...repo, ref: 'tags/' + tag.name });
            }
